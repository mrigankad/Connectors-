name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1-5"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    # No secrets: lint, types, manifests/catalog validation, unit + contract tests, and integration/e2e tests
    # against a disposable PostgreSQL service container.
    name: Offline lane
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wayam
          POSTGRES_PASSWORD: wayam
          POSTGRES_DB: wayam_connectors_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wayam" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WAYAM_TEST_DATABASE_URL: postgresql://wayam:wayam@127.0.0.1:5432/wayam_connectors_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Lint
        run: .venv/bin/python -m ruff check src tests scripts && .venv/bin/python -m ruff format --check src tests scripts
      - name: Typecheck
        run: .venv/bin/python -m mypy
      - name: Validate manifests and catalog registry
        run: .venv/bin/python -m wayam_connectors.cli validate-manifests && .venv/bin/python -m wayam_connectors.cli validate-catalog
      - name: Grant CREATEROLE to the test role (integration tests create a read-only role)
        run: PGPASSWORD=wayam psql -h 127.0.0.1 -U wayam -d wayam_connectors_test -c "ALTER ROLE wayam CREATEROLE;"
      - name: Tests (unit, contract, integration, e2e)
        run: .venv/bin/python -m pytest -q -m "not live"
      - name: OpenAPI contract and generated Python SDK are up to date
        run: |
          .venv/bin/python -m wayam_connectors.cli export-openapi /tmp/openapi.json
          diff -q /tmp/openapi.json packages/contracts/openapi.json
          cp packages/sdk-python/wayam_connectors_sdk/client.py /tmp/client.py
          .venv/bin/python scripts/generate_sdks.py --python-only
          diff -q /tmp/client.py packages/sdk-python/wayam_connectors_sdk/client.py
      - name: Generated SDK imports
        run: .venv/bin/python -c "import sys; sys.path.insert(0, 'packages/sdk-python'); import wayam_connectors_sdk"

  live-canary:
    # Credentialed canaries against approved test tenants. Runs only on a schedule when secrets exist; never on PRs.
    # Requires repository secret WAYAM_LIVE_GITHUB_TOKEN (fine-grained PAT, read-only on the canary repository).
    name: Live canary (scheduled, needs secrets)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: GitHub live tests
        env:
          WAYAM_LIVE_GITHUB: ${{ secrets.WAYAM_LIVE_GITHUB_TOKEN != '' && '1' || '0' }}
          WAYAM_LIVE_GITHUB_TOKEN: ${{ secrets.WAYAM_LIVE_GITHUB_TOKEN }}
          WAYAM_LIVE_GITHUB_REPO: mrigankad/Chakram
        run: .venv/bin/python -m pytest -q -m live tests/live
