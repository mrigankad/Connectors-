[project]
name = "wayam-connectors-sdk"
version = "0.1.0"
description = "Generated client for the Wayam Connector Platform API"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wayam_connectors_sdk"]
