[project]
name = "wayam-connectors"
version = "0.1.0"
description = "Wayam shared multi-tenant connector platform: contracts, adapters, durable sync runtime and control API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "cryptography==50.0.2",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "boto3==1.43.114",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[project.scripts]
wayam-connectors = "wayam_connectors.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wayam_connectors"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a local PostgreSQL (WAYAM_TEST_DATABASE_URL)",
    "live: needs real provider credentials; blocked, never faked, when absent",
    "e2e: product journey tests",
]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]
ignore = ["S101", "S608", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"src/wayam_connectors/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
files = ["src/wayam_connectors"]
